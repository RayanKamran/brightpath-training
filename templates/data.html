{% extends "base.html" %}
{% block content %}
  <table>
    <caption>Rows in the database</caption>
    <thead><tr><th scope="col">Table</th><th scope="col">Rows</th></tr></thead>
    <tbody>
      {% for table, count in counts %}
      <tr><td>{{ table }}</td><td>{{ "{:,}".format(count) }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
