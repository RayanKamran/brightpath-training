<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrightPath</title>
</head>
<body>
  <h1>BrightPath</h1>
  <table>
    <caption>Rows in the database</caption>
    <thead><tr><th scope="col">Table</th><th scope="col">Rows</th></tr></thead>
    <tbody>
      {% for table, count in counts %}
      <tr><td>{{ table }}</td><td>{{ "{:,}".format(count) }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
