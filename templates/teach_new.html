{% extends "base.html" %}
{% block title %}Create a cohort — BrightPath{% endblock %}
{% block content %}
  <h1>Create a cohort</h1>
  <p>It starts as a draft that learners can't see. You become its lead.</p>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p><label>Course title <input name="title" list="titles" value="{{ form.title }}" required></label>
      <datalist id="titles">{% for t in titles %}<option value="{{ t }}">{% endfor %}</datalist></p>
    <p><label>Category <input name="category" value="{{ form.category }}"></label></p>
    <p><label>Description<br><textarea name="description" rows="3" cols="60">{{ form.description }}</textarea></label></p>
    <p><label>Cohort label (e.g. Feb 2027) <input name="cohort" value="{{ form.cohort }}" required></label></p>
    <p><label>Starts <input type="date" name="starts_on" value="{{ form.starts_on }}" required></label>
      <label>Ends <input type="date" name="ends_on" value="{{ form.ends_on }}" required></label></p>
    <p><button type="submit">Create cohort</button></p>
  </form>
{% endblock %}
