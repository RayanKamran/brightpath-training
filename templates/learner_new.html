{% extends "base.html" %}
{% block title %}Create a learner — BrightPath{% endblock %}
{% block content %}
  <h1>Create a learner</h1>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  {% if warning %}<p role="status">{{ warning }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p><label>Full name <input name="full_name" value="{{ form.full_name }}" required></label></p>
    <p><label>Email <input type="email" name="email" value="{{ form.email }}" required></label></p>
    <p>
      {% if clients is none %}
      Client: <strong>{{ own.name }}</strong>
      {% else %}
      <label>Client
        <select name="client_id">
          {% with selected = form.client_id %}{% include "_client_options.html" %}{% endwith %}
        </select>
      </label>
      {% endif %}
    </p>
    <p><label>Department
      <select name="department">
        <option value="">No department</option>
        {% for d in departments %}<option{% if form.department == d %} selected{% endif %}>{{ d }}</option>{% endfor %}
      </select>
    </label></p>
    <p><label>Starting password <input type="password" name="password" minlength="8" autocomplete="new-password" required></label></p>
    <p><button type="submit">Create learner</button></p>
  </form>
{% endblock %}
